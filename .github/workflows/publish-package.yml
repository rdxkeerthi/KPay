name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and packaging without publishing)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rdxkeerthi'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run validation and build
        run: npm run prepublishOnly

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to GitHub Packages (Dry Run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
