# SonarCloud Configuration for KPay
sonar.organization=rdxkeerthi
sonar.projectKey=rdxkeerthi_KPay
sonar.projectName=KPay
sonar.projectVersion=1.1.0

# Source & Test File Paths
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=dist/**,node_modules/**,scripts/**,coverage/**,**/*.d.ts
sonar.test.inclusions=tests/**/*.test.ts
sonar.cpd.exclusions=tests/**

# Code Coverage Integration
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignore Hardcoded Test Credential Warnings in Test Files
sonar.issue.ignore.multicriteria=testCredsJs,testCredsTs
sonar.issue.ignore.multicriteria.testCredsJs.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.testCredsJs.resourceKey=tests/**
sonar.issue.ignore.multicriteria.testCredsTs.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.testCredsTs.resourceKey=tests/**
